# Publica la web en GitHub Pages.
#
# La carpeta base la decide actions/configure-pages leyendo la configuración real
# del repositorio, así que funciona igual publicada en:
#   · usuario.github.io/Agora-Clan-Web  → base "/Agora-Clan-Web"
#   · agoraclan.com (dominio propio)    → base "/"
# Si algún día hiciera falta forzarla, basta con crear la variable de repositorio
# BASE_PATH (Settings → Secrets and variables → Actions → Variables).
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verificar y compilar
        run: npm run verify
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ vars.BASE_PATH || steps.pages.outputs.base_path }}

      - name: Comprobar que las rutas apuntan a la base correcta
        env:
          BASE_PATH: ${{ vars.BASE_PATH || steps.pages.outputs.base_path }}
        run: |
          BASE="${BASE_PATH%/}"
          echo "Base usada: '${BASE:-/}'"
          if ! grep -q "href=\"${BASE}/_astro/" dist/index.html; then
            echo "::error::Las rutas del HTML no coinciden con la base '${BASE:-/}'. El CSS daría 404."
            grep -o 'href="[^"]*_astro[^"]*"' dist/index.html | head -3
            exit 1
          fi
          echo "OK: el CSS y el JS apuntan a ${BASE:-}/_astro/"

      # Sin esto, Pages ignora /_astro por empezar con guion bajo
      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
